plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "dev.flutterquill.flutter_quill_example"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "dev.flutterquill.flutter_quill_example"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// espresso-core:3.2.0 과 espresso-idling-resource:3.2.0 이 동일한 namespace를 공유하여
// AGP 9.0.1 에서 manifest merger 실패가 발생한다. 3.5.1로 강제 업그레이드하여 해결한다.
configurations.all {
    resolutionStrategy {
        force 'androidx.test.espresso:espresso-core:3.5.1'
        force 'androidx.test.espresso:espresso-idling-resource:3.5.1'
    }
}

flutter {
    source = "../.."
}
